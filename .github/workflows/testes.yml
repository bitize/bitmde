name: Testes

# Roda em todo push e PR na main e decide pelos arquivos alterados se a suíte
# precisa rodar. Não é paths-ignore de propósito: workflow pulado por filtro de
# caminho não reporta status, e o check "Testes" é obrigatório no ruleset da
# main — PR só de docs ficaria esperando para sempre. Mudança só em **/*.md,
# .docs/**, .claude/** ou LICENSE pula a matriz; basta um arquivo fora da lista
# para tudo rodar. O Prettier que valida o Markdown está em qualidade.yml.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Nenhum job aqui escreve no repositório: leitura basta, e o GITHUB_TOKEN
# não fica gravado no .git/config dos runners (persist-credentials: false).
permissions:
  contents: read

jobs:
  mudancas:
    name: Arquivos alterados
    runs-on: ubuntu-latest
    outputs:
      codigo: ${{ steps.filtro.outputs.codigo }}

    steps:
      # Histórico inteiro, mas sem blobs: o diff por nome só precisa das árvores,
      # e .docs/ tem PDF e planilha que não interessam aqui.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none

      # No PR compara a base com a cabeça; no push, o topo anterior da main com
      # o novo. Se a comparação falhar (push que cria a branch, commit anterior
      # inexistente), erra para o lado seguro e roda a suíte inteira.
      - name: Filtrar arquivos de código
        id: filtro
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          CABECA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if ! ALTERADOS=$(git diff --name-only "$BASE...$CABECA" 2>/dev/null); then
            echo "::notice::Não foi possível comparar $BASE com $CABECA — a suíte roda inteira."
            echo "codigo=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CODIGO=$(printf '%s\n' "$ALTERADOS" | grep -vE '\.md$|^\.docs/|^\.claude/|^LICENSE$' || true)
          if [ -n "$CODIGO" ]; then
            echo "Arquivos que pedem a suíte:"
            printf '  %s\n' $CODIGO
            echo "codigo=true" >> "$GITHUB_OUTPUT"
          else
            echo "Só documentação mudou — a suíte não precisa rodar."
            echo "codigo=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Node ${{ matrix.node-version }}
    needs: mudancas
    if: needs.mudancas.outputs.codigo == 'true'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.x', '24.x']

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      # A suíte lê certs/ no topo de cada módulo de teste. Um certificado
      # autoassinado descartável basta para tudo, menos sefaz.test.js.
      - name: Gerar certificado de teste
        run: npm run certs:teste

      # Exclui sefaz.test.js: é teste de integração real contra os endpoints de
      # produção e homologação da SEFAZ, e exige certificado ICP-Brasil válido.
      # Exclui também tls-sefaz.test.js, que exige rede e roda em cadeia-tls.yml.
      - name: Rodar testes
        run: npm run test:ci

  # Este é o check obrigatório, e não "Node 22.x"/"Node 24.x": job de matriz
  # pulado por `if` reporta o nome sem expandir a variável, então os checks da
  # matriz nunca chegariam num PR só de docs. Este roda sempre e traduz o
  # resultado — pulado por falta de código conta como verde, falha ou
  # cancelamento em qualquer versão do Node conta como vermelho.
  testes:
    name: Testes
    needs: [mudancas, test]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Conferir resultado
        env:
          MUDANCAS: ${{ needs.mudancas.result }}
          SUITE: ${{ needs.test.result }}
        run: |
          if [ "$MUDANCAS" != success ]; then
            echo "O filtro de arquivos terminou em $MUDANCAS."
            exit 1
          fi
          case "$SUITE" in
            success) echo "Suíte verde em Node 22 e 24." ;;
            skipped) echo "Só documentação mudou — suíte dispensada." ;;
            *) echo "A suíte terminou em $SUITE."; exit 1 ;;
          esac
