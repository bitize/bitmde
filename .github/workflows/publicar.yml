name: Publicar

# Dispara só em release publicado no GitHub — não em push na main. A tag do
# release é a fonte da verdade da versão, e o release dá o ponto de aprovação
# humana entre "está na main" e "está no npm".
on:
  release:
    types: [published]

# Trusted Publishing (OIDC): o npm troca este token de identidade do GitHub por
# uma credencial de publicação de curta duração. Não existe NPM_TOKEN guardado
# como secret — se `id-token: write` sumir daqui, a publicação passa a falhar
# por falta de credencial. O job não escreve no repositório, então `contents`
# fica em leitura e o GITHUB_TOKEN não é gravado no .git/config do runner.
permissions:
  contents: read
  id-token: write

jobs:
  publicar:
    name: npm publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      # Trusted publishing exige npm >= 11.5.1, posterior ao npm que acompanha o
      # Node 22. O range fixa o requisito sem pegar um major novo sem aviso.
      - name: Atualizar npm
        run: npm install -g npm@^11.5.1

      # npm ci: instala exatamente o que está no package-lock.json, para que o
      # build que vira pacote seja reproduzível.
      - run: npm ci

      # A tag manda no que é publicado. Se divergir do package.json, o pacote
      # sairia com um número que ninguém pediu — e versão no npm não se reescreve.
      - name: Conferir tag contra package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSAO=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$VERSAO" ]; then
            echo "Tag $TAG não corresponde ao package.json (esperado v$VERSAO)."
            exit 1
          fi

      # src/env/version.js é commitado e alimenta o header User-Agent. Bumpar o
      # package.json sem rodar `npm run build` deixa os dois fora de sincronia.
      # Compara o valor, e não os bytes: o arquivo está em LF no índice e o build
      # o reescreve em CRLF, então um `git diff` acusaria diferença sempre.
      - name: Conferir src/env/version.js
        run: node -e "const v=require('./src/env/version.js').VERSION, p=require('./package.json').version; if (v!==p) { console.error('src/env/version.js está em '+v+', mas o package.json está em '+p+'. Rode npm run build e commite o resultado.'); process.exit(1) }"

      # Repete a suíte já rodada na main: fecha a janela entre o último push e a
      # criação da tag, que é justamente onde um release erra.
      - name: Gerar certificado de teste
        run: npm run certs:teste

      - name: Rodar testes
        run: npm run test:ci

      # lib/ e dist/ são gitignored e gerados. Sem este passo o pacote sai sem o
      # próprio código.
      - name: Build
        run: npm run build

      # O que vai no pacote é decidido pelo `files` do package.json. Este guard
      # existe para o erro não passar silencioso: um tarball errado é publicado
      # sem falhar em nenhum outro passo, e versão no npm não se reescreve.
      #
      # A conferência é por regra, não por snapshot da lista: lib/ espelha src/,
      # então uma lista congelada quebraria a cada arquivo novo e acabaria sendo
      # atualizada no reflexo, sem ninguém ler o diff. Precisa rodar DEPOIS do
      # build — antes dele lib/ e dist/ não existem e não haveria o que listar.
      - name: Conferir conteúdo do pacote
        env:
          PACOTE_JSON: ${{ runner.temp }}/pacote.json
        run: |
          npm pack --dry-run --json > "$PACOTE_JSON"
          node - <<'JS'
          const { readFileSync } = require('node:fs')

          const [{ files }] = JSON.parse(readFileSync(process.env.PACOTE_JSON, 'utf8'))
          const caminhos = files.map((f) => f.path)

          // Diretório termina em barra e casa por prefixo; o resto é nome exato.
          const proibidos = [
            'src/',
            'test/',
            'scripts/',
            'certs/',
            '.docs/',
            '.github/',
            '.vscode/',
            '.claude/',
            'CLAUDE.md',
            'AGENTS.md',
            '.prettierignore',
            'package-lock.json',
            'tsconfig.json',
            'prettier.config.js',
          ]
          // CHANGELOG.md entra no pacote só porque o `files` o lista — o npm não
          // o inclui por conta própria, ao contrário de package.json, README e
          // LICENSE. Por isso ele precisa estar aqui: tirá-lo do `files` passaria
          // despercebido de outro jeito.
          const essenciais = [
            'lib/index.js',
            'dist/index.d.ts',
            'package.json',
            'README.md',
            'LICENSE',
            'CHANGELOG.md',
          ]

          const vazando = caminhos.filter((p) =>
            proibidos.some((q) => (q.endsWith('/') ? p.startsWith(q) : p === q))
          )
          const faltando = essenciais.filter((p) => !caminhos.includes(p))

          if (vazando.length) {
            console.error('Arquivos que não deveriam ser publicados:')
            vazando.forEach((p) => console.error('  ' + p))
          }
          if (faltando.length) {
            console.error('Arquivos essenciais ausentes do pacote:')
            faltando.forEach((p) => console.error('  ' + p))
          }
          if (vazando.length || faltando.length) {
            console.error('\nConfira o campo `files` do package.json.')
            process.exit(1)
          }

          console.log(`Pacote com ${caminhos.length} arquivos, dentro do esperado.`)
          JS

      # Versão no npm não se reescreve, então republicar não é erro a corrigir:
      # é trabalho já feito. Dois casos chegam aqui com a versão no registro —
      # o bootstrap de um nome novo, publicado da máquina porque o trusted
      # publisher exige o pacote existindo, e o re-run de um release. Nos dois,
      # o certo é pular e terminar verde, não falhar com EPUBLISHCONFLICT.
      #
      # O teste é por saída não-vazia, e não pelo código de saída: o npm 11 sai
      # com 1 para versão inexistente, versões anteriores saem com 0 e não
      # imprimem nada. A saída é o único sinal estável entre as duas.
      #
      # Se o registro ainda não propagou a leitura de um pacote recém-criado, o
      # guard erra para o lado seguro: não encontra, tenta publicar, e aí sim o
      # npm recusa — mesmo comportamento de antes deste passo existir.
      - name: Conferir se a versão já está no npm
        id: publicada
        run: |
          PACOTE=$(node -p "require('./package.json').name")
          VERSAO=$(node -p "require('./package.json').version")
          if [ -n "$(npm view "$PACOTE@$VERSAO" version 2>/dev/null)" ]; then
            echo "ja-publicada=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$PACOTE@$VERSAO já está no npm — publicação pulada."
          else
            echo "ja-publicada=false" >> "$GITHUB_OUTPUT"
          fi

      # Sem --provenance: com trusted publishing o npm gera a atestação sozinho.
      # Sem --access public: já está em publishConfig.access no package.json.
      - name: Publicar no npm
        if: steps.publicada.outputs.ja-publicada == 'false'
        run: npm publish
